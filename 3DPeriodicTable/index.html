<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta
      name="description"
      content="基于 three.js CSS3D 的 3D 元素周期表：支持表格 / 球面 / 螺旋 / 网格四种布局，可拖拽旋转"
    />
    <title>3D 元素周期表 · three.js CSS3D</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        background-color: #68217a;
        margin: 0;
        font-family: Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      #container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      a {
        color: #ffffff;
      }

      #info {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        color: #ffffff;
        padding: 6px 0;
        font-family: Consolas, Menlo, monospace;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        z-index: 1;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      #menu {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 1;
      }

      .element {
        width: 120px;
        height: 160px;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        border: 1px solid rgba(127, 255, 255, 0.25);
        text-align: center;
        cursor: default;
        border-radius: 4px;
        user-select: none;
      }

      .element:hover {
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.75);
        border: 1px solid rgba(127, 255, 255, 0.75);
      }

      .element .number {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 12px;
        color: rgba(127, 255, 255, 0.75);
      }

      .element .symbol {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        font-size: 60px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.95);
        line-height: 1;
      }

      .element .details {
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        font-size: 12px;
        color: rgba(127, 255, 255, 0.75);
        line-height: 1.5;
        padding: 0 6px;
        box-sizing: border-box;
      }

      button {
        color: rgba(127, 255, 255, 0.75);
        background: transparent;
        outline: 1px solid rgba(127, 255, 255, 0.75);
        border: 0;
        padding: 6px 14px;
        margin: 0 4px;
        font-size: 14px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      button:hover {
        background-color: rgba(0, 255, 255, 0.5);
      }

      button:active {
        color: #000000;
        background-color: rgba(0, 255, 255, 0.75);
      }

      button:focus-visible {
        outline: 2px solid #ffffff;
      }
    </style>
  </head>
  <body>
    <script src="js/three.min.js"></script>
    <script src="js/tween.min.js"></script>
    <script src="js/TrackballControls.js"></script>
    <script src="js/CSS3DRenderer.js"></script>

    <div id="container"></div>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js css3d</a> · 3D
      元素周期表（拖拽旋转 · 滚轮缩放）
    </div>
    <div id="menu">
      <button type="button" data-mode="table" title="表格排列">TABLE</button>
      <button type="button" data-mode="sphere" title="球面排列">SPHERE</button>
      <button type="button" data-mode="helix" title="螺旋排列">HELIX</button>
      <button type="button" data-mode="grid" title="网格排列">GRID</button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
