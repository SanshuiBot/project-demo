<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="爱心树表白动画——把程序员的浪漫送给亲爱的 TA" />
    <title>爱心树表白 · 程序员的情书</title>

    <link rel="stylesheet" href="renxi/default.css" />

    <script src="renxi/functions.js"></script>
    <script src="renxi/love.js"></script>
  </head>
  <body>
    <!-- 点击引导浮层：动画开始前显示，点击后消失 -->
    <div id="hint" class="hint">
      <div class="hint-card">
        <div class="hint-heart">💗</div>
        <div class="hint-title">有一颗种子，等你唤醒</div>
        <div class="hint-sub">轻触屏幕 · 让爱慢慢生长</div>
        <div class="hint-arrow">↓</div>
      </div>
    </div>
    <audio id="bgm" src="renxi.mp3" preload="auto"></audio>
    <button id="sound" type="button" title="播放 / 暂停背景音乐" aria-label="播放或暂停背景音乐">
      🎵
    </button>

    <div id="main">
      <div id="error">
        本页面基于 HTML5 Canvas 制作，当前浏览器无法显示动画。 请使用 Chrome / Firefox / Edge /
        Safari 等支持 HTML5 的现代浏览器访问。
      </div>
      <div id="wrap">
        <div id="text">
          <div id="code">
            <!-- 修改下面的文字即可，把 ××× 换成 TA 的名字 -->
            <span class="say">亲爱的×××，我爱你</span><br />
            <span class="say">你对我来说</span><br />
            <span class="say">就是早晨的面包</span><br />
            <span class="say">晚上的香蕉</span><br />
            <span class="say">山东人的大蒜</span><br />
            <span class="say">四川人的辣椒</span><br />
            <span class="say">每一天都想和你在一起</span><br />
            <span class="say"><span class="space"></span>—— 爱你的×××</span>
          </div>
        </div>
        <div id="clock-box">
          <span class="muted">亲爱的小宝宝，我喜欢你</span>
          <span class="muted">已经是……</span>
          <div id="clock"></div>
        </div>
        <canvas id="canvas" width="1100" height="680"></canvas>
      </div>
    </div>

    <script src="renxi/main.js"></script>
  </body>
</html>
