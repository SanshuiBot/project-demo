<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta
      name="description"
      content="基于 three.js CSS3D 的 3D 元素周期表：支持表格 / 球面 / 螺旋 / 网格四种布局，可拖拽旋转"
    />
    <title>3D 元素周期表 · three.js CSS3D</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%234fd8f2' stroke-width='5'><ellipse cx='50' cy='50' rx='42' ry='17'/><ellipse cx='50' cy='50' rx='42' ry='17' transform='rotate(60 50 50)'/><ellipse cx='50' cy='50' rx='42' ry='17' transform='rotate(120 50 50)'/></g><circle cx='50' cy='50' r='9' fill='%236366f1'/></svg>"
    />
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        background-color: #0d1b2a;
        margin: 0;
        font-family: Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      #container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      a {
        color: #ffffff;
      }

      #info {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        color: #ffffff;
        padding: 6px 0;
        font-family: Consolas, Menlo, monospace;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        z-index: 1;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      #menu {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 1;
      }

      .element {
        width: 120px;
        height: 160px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        border: 1px solid rgba(127, 255, 255, 0.25);
        text-align: center;
        cursor: default;
        border-radius: 4px;
        user-select: none;
        position: relative;
        will-change: transform; /* 提前提升为合成层，避免动画中图层树反复重建 */
      }

      /* 首屏聚拢动画期间（main.js 给 #container 加 .intro）：暂时剥离辉光阴影。
         模糊阴影是 CSS3D 图层重光栅化最贵的部分，动画期间去掉、结束后恢复，最终观感不变 */
      .intro .element {
        box-shadow: none;
      }

      .intro .element .symbol {
        text-shadow: none;
      }

      /* 悬停高亮仅对真正有鼠标的设备生效，避免触屏点按后高亮"粘住"不消失 */
      @media (hover: hover) {
        .element:hover {
          box-shadow: 0 0 12px rgba(0, 255, 255, 0.75);
          border: 1px solid rgba(127, 255, 255, 0.75);
        }
      }

      /* 触摸手势交给 JS（TrackballControls）处理，浏览器不再响应滚动 / 双击缩放 */
      #container,
      #container .element {
        touch-action: none;
      }

      /* 放射性元素：左上角三角标记 + 红色虚线描边 */
      .element.radioactive::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        border-style: solid;
        border-width: 22px 22px 0 0;
        border-color: #ff4d4d transparent transparent transparent;
        opacity: 0.85;
      }

      .element.radioactive {
        outline: 2px dashed rgba(255, 80, 80, 0.9);
        outline-offset: -2px;
      }

      .element .number {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 12px;
        color: rgba(127, 255, 255, 0.75);
      }

      .element .symbol {
        position: absolute;
        top: 34px;
        left: 0;
        right: 0;
        font-size: 52px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 0 10px rgba(0, 255, 255, 0.95);
        line-height: 1;
      }

      /* 卡片底部信息区：固定两行、禁止换行，避免内容向上顶进元素符号区。
         行高用 px 锁定：无单位行高会被拼音声调字符（如 nǚ）的字体回退撑高，导致各卡片行距不一致 */
      .element .details {
        position: absolute;
        bottom: 10px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: rgba(210, 255, 255, 0.85);
        padding: 0 4px;
        box-sizing: border-box;
        overflow: hidden;
      }

      .element .details .el-line {
        line-height: 15px;
        white-space: nowrap;
        overflow: hidden;
        max-width: 100%;
      }

      .element .details .el-zh {
        font-size: 12px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.95);
      }

      .element .details .el-pinyin {
        font-size: 10px;
        margin-left: 3px;
        color: rgba(255, 255, 255, 0.55);
      }

      /* 卡片内状态徽章：液体 / 气体 / 固体 / 放射性 */
      .element .details .el-state {
        display: inline-block;
        margin-left: 4px;
        padding: 0 5px;
        border-radius: 8px;
        font-size: 9px;
        line-height: 14px;
        vertical-align: 1px;
        background: rgba(0, 0, 0, 0.45);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(127, 255, 255, 0.3);
      }

      .element .details .el-state.s-radioactive {
        color: rgba(255, 150, 150, 0.95);
        border-color: rgba(255, 80, 80, 0.7);
      }

      button {
        color: rgba(127, 255, 255, 0.75);
        background: transparent;
        outline: 1px solid rgba(127, 255, 255, 0.75);
        border: 0;
        padding: 6px 14px;
        margin: 0 4px;
        font-size: 14px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      button:hover {
        background-color: rgba(0, 255, 255, 0.5);
      }

      button:active {
        color: #000000;
        background-color: rgba(0, 255, 255, 0.75);
      }

      button:focus-visible {
        outline: 2px solid #ffffff;
      }

      /* ===== 元素详情面板（双击卡片弹出） ===== */
      #detail {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none; /* JS 选中元素后显示 */
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }

      #detail.open {
        display: flex;
      }

      .detail-card {
        width: min(420px, 86vw);
        padding: 28px 30px 24px;
        border-radius: 14px;
        background: rgba(10, 30, 34, 0.92);
        border: 1px solid rgba(127, 255, 255, 0.35);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
        color: #e8f7f7;
        user-select: none;
      }

      .detail-card .d-head {
        display: flex;
        align-items: center;
        gap: 18px;
        border-bottom: 1px solid rgba(127, 255, 255, 0.25);
        padding-bottom: 16px;
        margin-bottom: 14px;
      }

      .detail-card .d-symbol {
        font-size: 52px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 0 12px rgba(0, 255, 255, 0.9);
        line-height: 1;
      }

      .detail-card .d-title .d-zh {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .detail-card .d-title .d-pinyin {
        margin-bottom: 2px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }

      .detail-card .d-title .d-name {
        margin-top: 2px;
        font-size: 13px;
        color: rgba(127, 255, 255, 0.75);
      }

      .detail-card .d-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 18px;
        font-size: 13px;
        line-height: 1.7;
        margin-bottom: 14px;
      }

      .detail-card .d-meta .label {
        color: rgba(127, 255, 255, 0.6);
        margin-right: 6px;
      }

      /* 简介与用途两段：小标题 + 正文 */
      .detail-card .d-section {
        margin-bottom: 12px;
      }

      .detail-card .d-label {
        font-size: 11px;
        font-weight: bold;
        color: rgba(127, 255, 255, 0.6);
        letter-spacing: 1px;
        margin-bottom: 4px;
      }

      .detail-card .d-desc,
      .detail-card .d-use {
        font-size: 14px;
        line-height: 1.9;
        color: rgba(232, 247, 247, 0.9);
      }

      .detail-card .d-close {
        margin-top: 18px;
        width: 100%;
      }

      /* 图例：分类配色 + 放射性标记 */
      #legend {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 1;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        max-width: 160px;
        pointer-events: none;
      }

      #legend .legend-title {
        font-weight: bold;
        color: rgba(127, 255, 255, 0.9);
        margin-bottom: 8px;
      }

      #legend .legend-items {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 10px;
      }

      #legend .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        line-height: 1.3;
      }

      #legend .legend-item::before {
        content: "";
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--c);
        box-shadow: 0 0 4px var(--c);
      }

      #legend .legend-radio {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 150, 150, 0.9);
        font-size: 11px;
        line-height: 1.4;
      }

      #legend .radio-swatch {
        flex: 0 0 auto;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: #2a2a2a;
        outline: 2px dashed rgba(255, 80, 80, 0.9);
        outline-offset: -1px;
      }

      #legend .legend-updated {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
        line-height: 1.4;
      }

      /* 双击提示 */
      #hint {
        position: absolute;
        bottom: 64px;
        left: 0;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        z-index: 1;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      /* 触屏操作提示（仅手机端显示，与 .help-mouse 互斥） */
      .help-touch {
        display: none;
      }

      /* ===== 手机 / 窄屏适配 ===== */
      @media (max-width: 700px) {
        #info {
          font-size: 11px;
          padding: 6px 8px;
        }

        .help-mouse {
          display: none;
        }

        .help-touch {
          display: inline;
        }

        /* 图例默认折叠成小标签，点标题展开，避免挡住周期表主体 */
        #legend {
          top: 40px;
          transform: none;
          left: 10px;
          max-width: 150px;
          font-size: 11px;
          padding: 6px 10px;
          background: rgba(0, 0, 0, 0.55);
          pointer-events: auto;
        }

        #legend .legend-title {
          cursor: pointer;
        }

        #legend .legend-title::after {
          content: " ▾";
          color: rgba(127, 255, 255, 0.7);
        }

        #legend.open .legend-title::after {
          content: " ▴";
        }

        #legend:not(.open) .legend-items,
        #legend:not(.open) .legend-radio,
        #legend:not(.open) .legend-updated {
          display: none;
        }

        #menu button {
          padding: 5px 8px;
          margin: 0 2px;
          font-size: 12px;
        }

        #hint {
          bottom: 56px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> 3D 渲染 ·
      元素周期表<span class="help-mouse">（左键拖拽旋转 · 滚轮缩放 · 右键拖拽平移，若装有鼠标手势插件可能拦截右键）</span><span class="help-touch">（单指拖拽旋转 · 双指缩放/平移 · 双击卡片查看详情）</span>
    </div>
    <div id="hint">双击元素卡片查看详细介绍</div>

    <!-- 图例：分类配色 + 放射性标记说明 -->
    <div id="legend">
      <div class="legend-title" tabindex="0" role="button" aria-expanded="false" aria-controls="legend-items">分类图例</div>
      <div class="legend-items" id="legend-items">
        <span class="legend-item" style="--c:#e04038">碱金属</span>
        <span class="legend-item" style="--c:#e8821e">碱土金属</span>
        <span class="legend-item" style="--c:#3a6fd8">过渡金属</span>
        <span class="legend-item" style="--c:#2f9e63">主族金属</span>
        <span class="legend-item" style="--c:#9cbf2e">类金属</span>
        <span class="legend-item" style="--c:#18b8c9">非金属</span>
        <span class="legend-item" style="--c:#d9b324">卤素</span>
        <span class="legend-item" style="--c:#a678e8">稀有气体</span>
        <span class="legend-item" style="--c:#e8579f">镧系</span>
        <span class="legend-item" style="--c:#54258c">锕系</span>
      </div>
      <div class="legend-radio"><span class="radio-swatch"></span>放射性元素（红色角标 + 虚线描边）</div>
      <div class="legend-updated">数据更新：<span id="data-updated"></span></div>
    </div>

    <!-- 元素详情面板：内容由 JS 填充 -->
    <div id="detail" role="dialog" aria-modal="true" aria-labelledby="d-zh">
      <div class="detail-card">
        <div class="d-head">
          <div class="d-symbol"></div>
          <div class="d-title">
            <div class="d-pinyin"></div>
            <div class="d-zh" id="d-zh"></div>
            <div class="d-name"></div>
          </div>
        </div>
        <div class="d-meta">
          <div><span class="label">原子序数</span><span class="v-number"></span></div>
          <div><span class="label">相对原子质量</span><span class="v-mass"></span></div>
          <div><span class="label">族</span><span class="v-group"></span></div>
          <div><span class="label">周期</span><span class="v-period"></span></div>
          <div><span class="label">元素分类</span><span class="v-cat"></span></div>
          <div><span class="label">常温状态</span><span class="v-state"></span></div>
          <div><span class="label">所在区</span><span class="v-block"></span></div>
          <div><span class="label">发现</span><span class="v-disc"></span></div>
          <div><span class="label">熔点（℃）</span><span class="v-mp"></span></div>
          <div><span class="label">沸点（℃）</span><span class="v-bp"></span></div>
          <div><span class="label">密度（g/cm³）</span><span class="v-den"></span></div>
        </div>
        <div class="d-section">
          <div class="d-label">元素简介</div>
          <div class="d-desc"></div>
        </div>
        <div class="d-section">
          <div class="d-label">主要用途</div>
          <div class="d-use"></div>
        </div>
        <button type="button" class="d-close" title="关闭详情（也可按 Esc 或点击遮罩）">关闭</button>
      </div>
    </div>
    <div id="menu">
      <button type="button" data-mode="table" title="切换为标准周期表排列">表格排列</button>
      <button type="button" data-mode="sphere" title="切换为球面排列">球面排列</button>
      <button type="button" data-mode="helix" title="切换为双螺旋排列">螺旋排列</button>
      <button type="button" data-mode="grid" title="切换为网格排列">网格排列</button>
    </div>

    <!-- 脚本统一放 body 末尾：DOM 先解析渲染，库脚本不阻塞首屏；加载顺序不可变（main.js 依赖前面的全局） -->
    <script src="js/three.min.js"></script>
    <script src="js/tween.min.js"></script>
    <script src="js/TrackballControls.js"></script>
    <script src="js/CSS3DRenderer.js"></script>
    <script src="js/element-data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
