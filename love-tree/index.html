<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="爱心树表白动画——把程序员的浪漫送给亲爱的 TA" />
    <title>爱心树表白 · 程序员的情书</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 62 8 44 8 30 C8 16 20 8 32 8 C40 8 47 13 50 20 C53 13 60 8 68 8 C80 8 92 16 92 30 C92 44 80 62 50 88 Z' fill='%23ff4d8d'/></svg>"
    />

    <link rel="stylesheet" href="assets/default.css" />
  </head>
  <body>
    <audio id="bgm" src="assets/bgm.mp3" preload="metadata"></audio>
    <button id="sound" type="button" title="播放 / 暂停背景音乐" aria-label="播放或暂停背景音乐">
      🎵
    </button>
    <button id="replay" type="button" title="重新播放" aria-label="重新播放">↻ 重新播放</button>

    <noscript>
      <p style="margin: 40px auto; max-width: 640px; text-align: center; line-height: 2">
        本页面的爱心树动画依赖 JavaScript。请在浏览器设置中启用 JavaScript 后刷新页面。
      </p>
    </noscript>

    <div id="main">
      <div id="error">
        本页面基于 HTML5 Canvas 制作，当前浏览器无法显示动画。 请使用 Chrome / Firefox / Edge /
        Safari 等支持 HTML5 的现代浏览器访问。
      </div>
      <div id="wrap">
        <div id="text">
          <div id="code">
            <!-- 情书由 assets/config.js 注入：称呼「亲爱的×××」取自 to，署名「爱你的×××」取自 from，正文取自 text -->
          </div>
        </div>
        <div id="clock-box">
          <!-- 以下两行引导语为页面内置文案（不属于 config.js 的可配置项） -->
          <span class="muted">亲爱的小宝宝，我喜欢你</span>
          <span class="muted">已经是……</span>
          <div id="clock"></div>
        </div>
        <!-- 点击引导：霓虹流光描边（非全屏，点击穿透，点中心形后消失） -->
        <div id="guide" class="guide" aria-hidden="true">
          <div class="guide-ring-glow">
            <div class="guide-ring">
              <i class="guide-sweep"></i>
            </div>
          </div>
          <span class="guide-text">轻轻点它，让爱发芽</span>
        </div>
        <canvas id="canvas" width="1100" height="680"></canvas>
      </div>
    </div>

    <script src="assets/config.js"></script>
    <script src="assets/functions.js"></script>
    <script src="assets/love.js"></script>
    <script src="assets/main.js"></script>
  </body>
</html>
