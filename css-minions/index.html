    <!--

  四个实例结构完全相同，仅通过 .minion-1 ~ .minion-4 上的 CSS 区分大小与单/双眼：
    .minion-1  标准尺寸 · 双眼
    .minion-2  瘦高身材 · 独眼（右侧镜片隐藏）
    .minion-3  矮胖身材 · 独眼（右侧镜片隐藏）
    .minion-4  高个身材 · 双眼
  窄屏下整行由下方脚本按 BASE_WIDTH 等比缩放居中。
-->

    <div class="stage">

          <div class="hair2"></div>
          <div class="hair3"></div>

        <div class="glasses-type"></div>
        <div class="glasses left-glasses">

        </div>
        <div class="glasses right-glasses">

        </div>
        <div class="mouth">

            <div class="line"></div>
            <div class="tooth1"></div>
            <div class="tooth2"></div>
            <div class="tooth3"></div>
          </div>
        </div>
        <div class="arm left-arm"><div class="hand"></div></div>
        <div class="arm right-arm"><div class="hand"></div></div>
        <div class="pocket">
          <div><div></div></div>
        </div>
        <div class="trousers"></div>
        <div class="leg left-leg"><div class="footer"></div></div>
        <div class="leg right-leg"><div class="footer"></div></div>
      </div>

  <script>
    (function () {
      "use strict";
      // 四只小黄人弹性行的布局总宽：380 + 334.4 + 437 + 380 = 1531.4px
      var BASE_WIDTH = 1531.4;
      var zoomer = document.querySelector(".stage-zoomer");
      if (!zoomer) return;

      function fit() {
        var vw = document.documentElement.clientWidth;
        var scale = Math.min(1, vw / BASE_WIDTH);
        if (scale < 1) {
          // 先清除缩放，测量舞台未缩放时的布局几何
          zoomer.style.transform = "";
          var box = zoomer.getBoundingClientRect();
          var vh = document.documentElement.clientHeight;
          var visH = box.height * scale; // 缩放后的实际视觉高度

          // 视觉高度高于视口：不做上移，保持从顶部可滚动看到全部内容；
          // 视觉高度不高于视口：垂直居中，并隐藏页面滚动条消除空白滚动区
          var shiftY = visH > vh ? 0 : vh / 2 - (box.top + box.height / 2);
          zoomer.style.transformOrigin = "center center";
          zoomer.style.transform = "translateY(" + shiftY + "px) scale(" + scale + ")";
          zoomer.style.width = BASE_WIDTH + "px";
          document.documentElement.style.overflow = visH > vh ? "" : "hidden";
        } else {
          zoomer.style.transform = "";
          zoomer.style.transformOrigin = "";
          zoomer.style.width = "";
          document.documentElement.style.overflow = "";
        }
      }

      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });
      fit();
    })();
  </script>
